services:
  postgres:
    image: postgres:17
    container_name: ihys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ihys
      POSTGRES_USER: ihys
      POSTGRES_PASSWORD: ihys
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihys -d ihys"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: ihys_backend
    build:
      context: ./backend
      target: ${DOCKER_TARGET:-dev}
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env.backend
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: ihys_frontend
    build:
      context: ./frontend
      target: ${DOCKER_TARGET:-dev}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    env_file:
      - ./.env.frontend
    environment:
      - NUXT_HOST=0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
