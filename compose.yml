services:
  postgres:
    image: postgres:17
    container_name: ihys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy

  backend:
    container_name: ihys_backend
    build:
      context: ./backend
      target: ${DOCKER_TARGET:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - ./.env.backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy

  frontend:
    container_name: ihys_frontend
    build:
      context: ./frontend
      target: ${DOCKER_TARGET:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env.frontend
    environment:
      - NUXT_HOST=0.0.0.0
    depends_on:
      - backend
    networks:
      - proxy

volumes:
  postgres_data:

networks:
  proxy:
    external: true